<!doctype html>
<html lang="en">
  <!-- Song runtime: loaded by the app in <iframe sandbox="allow-scripts" allow="autoplay"> (opaque origin). -->
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin" />
    <title>Shawarma runtime</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #unlock { display: none; box-sizing: border-box; width: 100%; height: 100vh; font: 13px ui-monospace, Menlo, monospace; background: #3a2a10; color: #fd8; border: 1px solid #a80; cursor: pointer; }
      #unlock.show { display: block; position: fixed; inset: 0; z-index: 2; }
      /* song visuals panel: inline widget canvases stacked; full-panel draws use Strudel's fixed canvas */
      #visuals { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; align-items: flex-start; }
      #visuals canvas { display: block; }
    </style>
  </head>
  <body><button id="unlock" type="button">Click to enable audio</button><div id="visuals"></div><script type="module">import "/src/runtime/main.ts";</script></body>
</html>
